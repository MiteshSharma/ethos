appId: com.ethos.desktop
productName: Ethos
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: dist-electron
files:
  - dist/main/**
  - dist/preload/**
  - node_modules/**
extraResources:
  - from: ../../apps/web/dist
    to: web-dist
    filter:
      - "**/*"
  # Call-capture's native binaries — resolved at runtime by
  # `resolveCallCaptureNativePath()` in `src/main/call-capture.ts`. Only
  # `native/bin` (the compiled Swift helpers) and `native/vendor/audiotee`
  # (the vendored audio-tap binary) are needed; `native/vendor/audiotee-src`
  # is the vendored SOURCE checkout (its own `.git`, `.build`, etc.) and is
  # never read at runtime.
  - from: ../../extensions/platform-callcapture/native/bin
    to: callcapture-native/bin
    filter:
      - "**/*"
  - from: ../../extensions/platform-callcapture/native/vendor/audiotee
    to: callcapture-native/vendor/audiotee
    filter:
      - "**/*"
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
    - target: zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
win:
  icon: build/icon.ico
  target: nsis
linux:
  icon: build/icon.png
  target: AppImage
publish:
  provider: github
  releaseType: release
