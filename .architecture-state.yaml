# .architecture-state.yaml — the operational state sidecar
#
# WHAT THIS IS. The mechanical inventory of what this repository currently
# CONTAINS: which package sits at which path, which layer it belongs to, which
# security tier it is held to, and which §VIII exceptions are open right now.
#
# WHAT THIS IS NOT. It is not policy. ARCHITECTURE.md §IX is the authority on
# what is ALLOWED — layers, dependency direction, laws, exception shape. This
# file records only what EXISTS. Where the two disagree, §IX wins and this file
# is the thing to fix. §IX declares this file by name
# (`state_sidecar: ".architecture-state.yaml"`), and §VIII sends active
# exceptions here rather than into the constitution.
#
# HOW IT CHANGES. Freely, in an ordinary PR, in the same commit as the change it
# records. Adding a package means adding its tier here. That is deliberate: a
# tier assigned AFTER a security report arrives is rationalisation, not triage,
# and a reporter reading `git log` can tell the difference. Every assignment
# carries the date it was made so the pre-commitment is checkable.
#
# READ WITH. docs/content/security/security-boundary.md (the tier roster and the
# guarantee register), SECURITY.md (the triage decision table), ARCHITECTURE.md
# §II (layers), §VIII (exceptions), §IX (validator rules).

version: 1

# ---- Layers (§II) ---------------------------------------------------------
# The path inventory behind ARCHITECTURE.md §II's layer model. Order matches
# §IX: a layer may depend on any layer beneath it and none above it.
#
# `security-kernel` covers six packages under packages/safety/ plus the named
# enforcement files inside packages/core and packages/wiring. §II names the
# layer and §IX carries its rules, so this entry is the path inventory behind a
# constitutional layer rather than the record-of-fact-without-policy it was
# before the Phase 2 amendment (plan/phases/security-boundary.md G1).
#
# §II names five layers and does not partition packages/* exhaustively. The
# library packages not listed below (a2a, agent-bridge, config, design-tokens,
# logger, oauth-core, plugin-contract, plugin-sdk, pricing, sdk, session-lane,
# surface-kit, ui-components, web-contracts) have no layer assignment today.
# They all carry a tier, which is the assignment the security boundary needs.
# `packages/sqlite` is the one exception: it is classified `vendored` below,
# which is a positive statement rather than an absence.

layers:
  - name: contracts
    paths:
      - packages/types

  - name: security-kernel
    paths:
      - packages/safety/channel
      - packages/safety/injection
      - packages/safety/network
      - packages/safety/redact
      - packages/safety/scanner
      - packages/safety/watcher
      - packages/storage-fs
    # Enforcement points that live inside other packages. Listed by file
    # because the packages they sit in are only partly kernel; the same files
    # appear as `kernel_paths` on the package entries under `tiers:` below.
    embedded_paths:
      - packages/core/src/agent-loop.ts
      - packages/core/src/tool-registry.ts
      - packages/core/src/agent-loop/approval-posture.ts
      - packages/core/src/agent-loop/stages/context-assembly.ts
      - packages/core/src/agent-loop/stages/per-call-enforcement.ts
      - packages/core/src/agent-loop/stages/tool-processing.ts
      - packages/core/src/agent-loop/stages/tool-rejection.ts
      - packages/core/src/agent-loop/result-defense.ts
      - packages/core/src/scoped/scoped-fs.ts
      - packages/core/src/scoped/scoped-fetch.ts
      - packages/core/src/scoped/scoped-process.ts
      - packages/core/src/scoped/scoped-secrets.ts
      - packages/core/src/scoped/scoped-attachments.ts
      - packages/core/src/fs-reach.ts
      - packages/core/src/path-boundary.ts
      - packages/core/src/url-validator.ts
      - packages/core/src/capability-validator.ts
      - packages/core/src/capability-resolver.ts
      - packages/core/src/hook-registry.ts
      - packages/core/src/script-safe.ts
      - packages/wiring/src/build-agent-loop.ts
      - packages/wiring/src/danger-predicate.ts
      - packages/wiring/src/approval-seams.ts
      - packages/wiring/src/smart-approver.ts
      - packages/wiring/src/resolve-execution-posture.ts
      - packages/wiring/src/skill-passthrough.ts

  - name: core
    paths:
      - packages/core

  - name: extensions
    paths:
      - extensions/*

  - name: wiring
    paths:
      - packages/wiring

  - name: apps
    paths:
      - apps/*

# ---- Vendored runtime shims ----------------------------------------------
# Workspace packages that are functionally EXTERNAL dependencies which happen
# to live in-repo: a thin wrapper over a platform primitive, carrying no Ethos
# semantics, no contract, and no policy. The layer check reads them the way it
# reads an npm dependency — a closed layer (contracts / security-kernel / core)
# may depend on one without that edge being an unclassified reach.
#
# This is the narrowest possible carve-out and it is deliberately expensive to
# claim: `rationale` is REQUIRED and must be non-empty, and the validator fails
# on an entry without one. The bar is "no Ethos semantics" — not "small", not
# "infrastructural", not "nobody has assigned it a layer yet". A package that
# implements an Ethos contract (`@ethosagent/logger` implements `Logger`) or
# encodes an Ethos decision (`@ethosagent/design-tokens` is DESIGN.md as code)
# does NOT qualify, however low-level it looks.
#
# A vendored package still carries a tier. Vendoring answers "which layer
# rules apply", never "is this in the security boundary".

vendored:
  "@ethosagent/sqlite":
    path: packages/sqlite
    assigned: 2026-08-12
    rationale: >-
      A synchronous shim over Node's built-in `node:sqlite` (`DatabaseSync`),
      resolved through `process.getBuiltinModule` so a bundler cannot rewrite
      the `node:` specifier. It has zero dependencies, imports nothing from
      `@ethosagent/*`, and contains no Ethos semantics: no contract, no
      personality concept, no policy, no boundary decision — only parameter
      marshalling and a `run/get/all` surface over the platform API. It exists
      as a workspace package rather than an npm dependency because it is
      Node-version-coupled glue we must be able to patch in the same commit as
      its caller. `packages/safety/channel` depends on it for the DM pairing
      store, which legitimately needs SQLite; routing that through a contract
      seam would add an indirection whose only purpose is to satisfy a layer
      rule aimed at Ethos-semantic coupling that this package does not have.

# ---- App entry modules (§II thin wiring adapter, §IX composition_root) -----
# §II grants an app "its own thin wiring adapter" and §IX grants apps
# `composition_root: "entry modules only"`. Neither enumerates WHICH modules,
# so Law 5 had no machine-readable boundary and the validator could only report
# it at manifest granularity, as advisory. This is that inventory: the files in
# each app that are permitted to import extensions and the security kernel
# directly.
#
# Derived from what the code actually is, not from what would make findings go
# away: the module each app's package.json names as its entry point, plus the
# app's dedicated wiring adapter where one exists by name
# (`apps/ethos/src/wiring.ts`, the archetype). Everything else in an app is
# ordinary app code and must reach concrete implementations through
# `@ethosagent/wiring`.
#
# Adding a path here is a claim that the file IS a composition root. It is not
# a suppression mechanism — the Law 5 file check is advisory today precisely
# because the repository does not yet match this inventory (see the note on the
# check in scripts/check-architecture.mjs), and padding the list to green the
# build would destroy the only signal that says so.

app_entry_modules:
  apps/acp-server:
    - apps/acp-server/src/index.ts
  apps/desktop:
    - apps/desktop/src/main/index.ts
    # The desktop's in-process backend composition root, and nothing else: it
    # builds the agent loop, session store, personality registry and identity
    # map, hands them to createWebApi, and binds the Hono server. Its only
    # app-specific state is the module-level server handle / bound port that
    # start/stop/getPort exist to manage.
    - apps/desktop/src/main/serve.ts
  apps/ethos:
    - apps/ethos/src/index.ts
    - apps/ethos/src/wiring.ts
    # Named wiring adapter for the ACP session-scoped MCP grant, extracted from
    # the acp command: it binds the concrete McpSessionView (@ethosagent/tools-mcp)
    # into acp-server's SessionViewFactory seam and closes the allowlist resolver
    # over the personality registry. Composition only — no command logic.
    - apps/ethos/src/lib/acp-mcp-wiring.ts
  apps/mcp-server:
    - apps/mcp-server/src/index.ts
  apps/tui:
    - apps/tui/src/index.ts
    - apps/tui/src/setup/index.ts
  apps/web-api:
    - apps/web-api/src/index.ts

# ---- Register anchors -----------------------------------------------------
# What each guarantee-register citation is ASSERTING at the line it points to.
#
# WHY THIS EXISTS. The register cites enforcement points as
# `<path>#L<line>` permalinks. A line number alone catches only half of
# citation drift: delete the file or the line, and the check fails; but INSERT
# twelve lines above the enforcement point and every anchor below it silently
# re-aims at real, non-blank, unrelated code. G11 — the reason this whole
# programme exists — was a published claim that had drifted from its
# enforcement point. A drift check that catches deletion but not displacement
# lets G11 recur in a quieter form, and this was found empirically: a lane
# adding a comment block to scoped-fs.ts would have pushed both G-FS anchors
# down onto other real lines with nothing failing.
#
# HOW IT WORKS. Every citation in the register must have exactly one entry
# here, matched on (row, path, line), and the cited line must CONTAIN the
# `contains` string. Move the code and the substring stops matching: CI fails
# and names the row. An entry matching no citation fails too, so this list
# cannot rot into a graveyard of anchors for claims that were withdrawn.
#
# CHOOSING `contains`. Pick the symbol or literal that IS the enforcement — a
# function name, an error token, the condition itself. Not indentation, not
# `{`, not a word that would still match a different line in the same file.
# The test to apply: if this string still matched after the control was
# rewritten, the anchor is worthless.

register_anchors:
  G-TOOLS:
    - { path: packages/core/src/tool-registry.ts, line: 206, contains: "toDefinitions(allowedTools" }
    - { path: packages/core/src/tool-registry.ts, line: 371, contains: "!allowedTools.includes(call.name)" }
    - { path: packages/core/src/tool-registry.ts, line: 274, contains: "enforce tool access at execution time" }
