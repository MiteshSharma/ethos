# ---- Security tiers -------------------------------------------------------
# Every workspace package under packages/, packages/safety/, extensions/, and
# apps/ carries a tier. 120 packages: 10 at Tier 0, 23 at Tier 1, 87 at Tier 2.
#
# The tier bounds what we promise to be CORRECT, not what we promise to LOOK
# AT. Triage reads the guarantee register first and the tier second — a Tier 2
# finding that defeats a published Tier 0 guarantee is a Tier 0 finding, and
# the fix belongs in the kernel rather than at the reporting site. The contract
# per tier is in docs/content/security/security-boundary.md; the four triage
# verdicts are in SECURITY.md.
#
# The workspace also includes `docs` and `examples/*` (pnpm-workspace.yaml).
# They ship no runtime code into an agent process and carry no tier.

tiers:
  # ---------------------------------------------------------------------------
  # Tier 0 — security kernel (the TCB). Guaranteed, CVE-eligible, no §VIII
  # exception path. A Tier 2 extension must not be able to weaken a Tier 0
  # guarantee. Roster and rationale: docs/content/security/security-boundary.md
  # ---------------------------------------------------------------------------

  packages/core:
    package: "@ethosagent/core"
    tier: 0
    assigned: 2026-08-12
    # Only these files are kernel. The rest of packages/core is Tier 1 by
    # default — it carries no named guarantee from the register.
    kernel_paths:
      - packages/core/src/agent-loop.ts
      - packages/core/src/tool-registry.ts
      - packages/core/src/agent-loop/approval-posture.ts
      - packages/core/src/agent-loop/stages/context-assembly.ts
      - packages/core/src/agent-loop/stages/per-call-enforcement.ts
      - packages/core/src/agent-loop/stages/tool-processing.ts
      - packages/core/src/agent-loop/stages/tool-rejection.ts
      - packages/core/src/agent-loop/result-defense.ts
      - packages/core/src/scoped/scoped-fs.ts
      - packages/core/src/scoped/scoped-fetch.ts
      - packages/core/src/scoped/scoped-process.ts
      - packages/core/src/scoped/scoped-secrets.ts
      - packages/core/src/scoped/scoped-attachments.ts
      - packages/core/src/fs-reach.ts
      - packages/core/src/path-boundary.ts
      - packages/core/src/url-validator.ts
      - packages/core/src/capability-validator.ts
      - packages/core/src/capability-resolver.ts
      - packages/core/src/hook-registry.ts
      - packages/core/src/script-safe.ts
    # NOT kernel, deliberately:
    #   sanitize-output.ts — `stripAnsiEscapes` is a pure string utility with no
    #     chokepoint. Every caller opts in (apps/ethos render paths,
    #     extensions/gateway, extensions/tools-code), so nothing in the kernel
    #     guarantees it runs and no register row publishes it. Tier 1 by default
    #     is the honest reading.
    #   safety-conformance.ts — `runAgentSafetyConformance` TESTS the kernel; it
    #     is invoked only from tests and sits on no request path. A test of an
    #     enforcement point is not an enforcement point. It appears in the
    #     register as a "Verify it yourself" reference instead.

  packages/safety/channel:
    package: "@ethosagent/safety-channel"
    tier: 0
    assigned: 2026-08-12

  packages/safety/injection:
    package: "@ethosagent/safety-injection"
    tier: 0
    assigned: 2026-08-12

  packages/safety/network:
    package: "@ethosagent/safety-network"
    tier: 0
    assigned: 2026-08-12

  packages/safety/redact:
    package: "@ethosagent/safety-redact"
    tier: 0
    assigned: 2026-08-12

  packages/safety/scanner:
    package: "@ethosagent/safety-scanner"
    tier: 0
    assigned: 2026-08-12

  packages/safety/watcher:
    package: "@ethosagent/safety-watcher"
    tier: 0
    assigned: 2026-08-12

  packages/storage-fs:
    package: "@ethosagent/storage-fs"
    tier: 0
    assigned: 2026-08-12

  packages/types:
    package: "@ethosagent/types"
    tier: 0
    assigned: 2026-08-12

  packages/wiring:
    package: "@ethosagent/wiring"
    tier: 0
    assigned: 2026-08-12
    # Only these files are kernel. The rest of packages/wiring is Tier 1 by
    # default — it carries no named guarantee from the register.
    kernel_paths:
      - packages/wiring/src/build-agent-loop.ts
      - packages/wiring/src/danger-predicate.ts
      - packages/wiring/src/approval-seams.ts
      - packages/wiring/src/smart-approver.ts
      - packages/wiring/src/resolve-execution-posture.ts
      - packages/wiring/src/skill-passthrough.ts

  # ---------------------------------------------------------------------------
  # Tier 1 — guarded surfaces. Not the kernel; they sit ON a trust boundary.
  # In disclosure scope with a stated response commitment. The promise is
  # "we review this hard", not "we guarantee this".
  # ---------------------------------------------------------------------------

  apps/web-api:
    package: "@ethosagent/web-api"
    tier: 1
    assigned: 2026-08-12

  extensions/delivery-ledger:
    package: "@ethosagent/delivery-ledger"
    tier: 1
    assigned: 2026-08-12

  extensions/execution-docker:
    package: "@ethosagent/execution-docker"
    tier: 1
    assigned: 2026-08-12

  # The Pi job runner spawns a foreign coding agent as its own OS process. It
  # implements no boundary itself — every mount comes out of execution-docker's
  # `mountsFor`, and the container IS the containment (Pi enforces no path
  # boundaries of its own) — but it decides what that derivation is asked for,
  # so a mistake here is a containment mistake. Tier 1 for the same reason
  # execution-docker is.
  extensions/execution-pi:
    package: "@ethosagent/execution-pi"
    tier: 1
    assigned: 2026-08-19

  # Same shape as execution-pi immediately above, for the same reason: this
  # package spawns a foreign coding-agent CLI (any real ACP-native agent) as
  # its own OS process and decides what mount derivation execution-docker's
  # `mountsFor` is asked for. It implements no boundary itself — the container
  # is the containment — but a mistake in what it asks for IS a containment
  # mistake, so it gets the same Tier 1, not Tier 2. (Contrast notify-queue,
  # assigned the same day: that package is a plain internal queue with no
  # subprocess/mount-derivation role, which is why it landed at Tier 2 while
  # this one does not.)
  extensions/execution-coding-agents:
    package: "@ethosagent/execution-coding-agents"
    tier: 1
    assigned: 2026-08-22

  extensions/execution-local:
    package: "@ethosagent/execution-local"
    tier: 1
    assigned: 2026-08-12

  extensions/gateway:
    package: "@ethosagent/gateway"
    tier: 1
    assigned: 2026-08-12

  extensions/observability-sqlite:
    package: "@ethosagent/observability-sqlite"
    tier: 1
    assigned: 2026-08-12

  extensions/platform-discord:
