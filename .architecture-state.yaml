# ---- Active exceptions (§VIII) --------------------------------------------
# Every entry requires all seven fields from ARCHITECTURE.md §VIII: `id`,
# `law`, `scope`, `reason`, `owner`, `created`, `removal_condition`,
# `review_by`. An exception with no named owner, an unobservable
# `removal_condition`, or a `review_by` that has passed without a renewal PR is
# a violation, not an exception. There is no permanent-grandfather list. §V
# Safety Constitution rules take no exceptions at all — they are amended
# through §VI or not at all, and no Tier 0 package is eligible for one.
#
# Empty was the correct state until the first entry below. It is not "no
# exceptions were needed"; it is "no exception has been granted through §VIII
# since this file existed".

exceptions:
  - id: EX-001
    law: "§III Law 5 — apps depend on [contracts, wiring] only"
    scope: apps/ethos/src/redact-error.ts
    reason: >-
      The crash logger imports @ethosagent/safety-redact directly instead of
      taking redaction through the composition root. It runs on the bootstrap
      path, BEFORE wiring exists, and it is synchronous by construction: it
      must finish writing before the process exits, so it cannot await a
      composition root that has not been built and in the crash case may never
      be. Routing it through wiring was measured against the alternatives and
      is the wrong direction — 18 ms direct versus 121 ms through the narrow
      subpath, paid on every CLI start to serve a path that runs only when the
      process is already dying. Redaction on this path is not optional: a crash
      log is exactly where an unredacted credential ends up, so removing the
      import rather than the coupling is not available either.
    owner: "@MiteshSharma"
    created: 2026-08-12
    removal_condition: >-
      apps/ethos/src/redact-error.ts no longer imports @ethosagent/safety-redact
      — either because the crash logger stops needing redaction, or because the
      redaction primitives it uses are inlined into apps/ethos and the workspace
      dependency is dropped from apps/ethos/package.json. Observable as: the
      import is absent from the file and the validator reports no Law 5 finding
      for this path with this entry removed.
    review_by: 2027-02-12
